name: Validate marketing site

# Ported from the website's own repo when it moved into apps/marketing. Same
# gates (docs contracts, lint, links, SEO smoke, e2e, a11y, visual,
# performance), adapted to the monorepo: bun instead of npm, and scoped to
# paths that can affect the site so unrelated PRs skip it.
on:
  pull_request:
    paths: &marketing_paths
      - "apps/marketing/**"
      - ".github/workflows/validate-marketing.yml"
      # The site installs from the root lockfile, so a dependency bump can
      # break it without touching apps/marketing.
      - "bun.lock"
  push:
    branches:
      - main
    paths: *marketing_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/marketing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test public-surface contracts
        run: bun run test:docs

      - name: Lint
        run: bun run lint

      - name: External link check
        run: bun run test:links
        timeout-minutes: 5

      - name: Build deterministic browser fixture
        run: VISUAL_TEST=1 bun run build

      # Must follow the build. src/lib/docs.ts imports `collections/server`,
      # which tsconfig maps to ./.source — a directory fumadocs generates
      # during the build and that .gitignore keeps out of the repo.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Smoke test production routes
        run: bun run test:seo-smoke

      - name: Functional browser checks
        id: e2e
        continue-on-error: true
        run: bun run test:e2e

      - name: Upload functional failure artifacts
        if: ${{ always() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-browser-failure
          path: |
            apps/marketing/playwright-report
            apps/marketing/test-results
          if-no-files-found: ignore

      - name: Accessibility checks
        id: a11y
        continue-on-error: true
        run: bun run test:a11y

      - name: Upload accessibility failure artifacts
        if: ${{ always() && steps.a11y.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-failure
          path: |
            apps/marketing/playwright-report
            apps/marketing/test-results
          if-no-files-found: ignore

      - name: Visual regression checks
        id: visual
        continue-on-error: true
        run: bun run test:visual

      - name: Upload visual failure artifacts
        if: ${{ always() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failure
          path: |
            apps/marketing/playwright-report
            apps/marketing/test-results
          if-no-files-found: ignore

      - name: Build normal production-data path
        run: |
          rm -rf .next
          bun run build

      - name: Production performance checks
        id: performance
        continue-on-error: true
        env:
          PERFORMANCE_RUNS: 3
        run: bun run test:performance

      - name: Upload performance failure artifact
        if: ${{ always() && steps.performance.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-failure
          path: apps/marketing/test-results/performance-summary.json
          if-no-files-found: error

      - name: Enforce browser quality gates
        if: ${{ always() }}
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          A11Y_OUTCOME: ${{ steps.a11y.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" != "success" || \
                "$A11Y_OUTCOME" != "success" || \
                "$VISUAL_OUTCOME" != "success" || \
                "$PERFORMANCE_OUTCOME" != "success" ]]; then
            echo "One or more browser quality gates failed. See the failing step and uploaded artifacts."
            exit 1
          fi

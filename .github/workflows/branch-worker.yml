name: Temporary Copilot Wiring Worker

on:
  push:
    branches:
      - agent/copilot-provider-wiring

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Transform and diagnose
        shell: bash
        run: |
          set +e
          python .automation.py > /tmp/automation.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/automation.log .automation-error.log
            echo "failed" > .automation-result
          else
            rm -f .automation.py .automation-touch .automation-error.log
            echo "success" > .automation-result
            bun run fmt >> /tmp/automation.log 2>&1
            rm -f .github/workflows/branch-worker.yml
          fi
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Copilot wiring worker result"
          git push

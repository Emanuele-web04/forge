services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: synara
      POSTGRES_PASSWORD: synara
      POSTGRES_DB: synara_accounts
    ports:
      - "5432:5432"
    volumes:
      - synara-api-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synara -d synara_accounts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  synara-api-pg:
